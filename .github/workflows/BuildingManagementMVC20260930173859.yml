name: Build and deploy ASP.NET Core app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'BuildingManagementMVC20260930173859'
  AZURE_RESOURCE_GROUP: 'buildingmanagement_group'
  DOTNET_VERSION: '8.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BuildingManagementMVC.csproj

      - name: Build
        run: dotnet build BuildingManagementMVC.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Publish
        run: dotnet publish BuildingManagementMVC.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: publish

      - name: Ensure Firebase Service Account is present
        shell: pwsh
        run: |
          $kuduUrl = "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/vfs/home/firebase-service-account.json"
          $username = "${{ secrets.KUDU_USERNAME }}"
          $password = "${{ secrets.KUDU_PASSWORD }}"

          $base64 = "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($base64)) {
            Write-Error "❌ FIREBASE_SERVICE_ACCOUNT_BASE64 is empty"
            exit 1
          }
          $bytes = [Convert]::FromBase64String($base64)

          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${username}:${password}"))
          $headers = @{ Authorization = "Basic $auth" }

          Write-Host "📤 Uploading firebase-service-account.json to /home..."
          try {
            Invoke-RestMethod -Uri $kuduUrl -Method Put -Headers $headers -Body $bytes -ContentType "application/octet-stream"
            Write-Host "✅ Uploaded successfully."
          } catch {
            Write-Error "❌ Upload failed: $_"
            exit 1
          }

      - name: Restart App Service
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp restart `
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} `
              --name ${{ env.AZURE_WEBAPP_NAME }}