<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>غير متصل — نظام إدارة العمارات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <style>
        body {
            background: #F7F5F1;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .offline-card {
            max-width: 480px;
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
            line-height: 1;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #12433C;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .btn-retry {
            background: #12433C;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

            .btn-retry:hover {
                background: #1a5a50;
            }

        .hint {
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>
            عذرًا، أنت غير متصل حاليًا. بعض الصفحات في التطبيق
            تحتاج اتصال بالإنترنت عشان تحمّل البيانات.
        </p>
        <button class="btn-retry" onclick="location.reload()">🔄 حاول تاني</button>
        <div class="hint">
            💡 نصيحة: لو مشغّل التطبيق كـ PWA، ممكن تفتح الصفحات
            المحفوظة من الكاش.
        </div>
    </div>
</body>
</html>
